    <style>
        html, body {

            overflow: hidden;

        #map {
            width: 100%;
            height: 100vh;
        }

        /* Header Tattico MATS */
        .mats-header {
            position: absolute;
            top: 12px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 1000;
            text-align: center;
            pointer-events: none;
            background: rgba(10, 10, 10, 0.85);
            padding: 8px 24px;
            border-radius: 12px;
            border: 1px solid rgba(255, 255, 255, 0.15);
            backdrop-filter: blur(6px);
            box-shadow: 0 4px 20px rgba(0,0,0,0.6);
        }

        .mats-title {
            font-size: 32px;
            font-weight: 900;
            letter-spacing: 2px;
            background: linear-gradient(45deg, #ff0000, #ff7f00, #ffff00, #00ff00, #00ffff, #0000ff, #8b00ff);
            background-size: 400% 400%;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            animation: rainbow-pulse 3s ease infinite;
            margin: 0;
            line-height: 1;
        }

        .mats-subtitle {
            font-size: 11px;
            font-weight: 700;
            color: #00bfff;
            letter-spacing: 1.5px;
            text-transform: uppercase;
            animation: blue-pulse 2s ease-in-out infinite;
            margin-top: 4px;
