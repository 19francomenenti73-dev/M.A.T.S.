<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>MATS 3D - Mesoscale Advanced Tracking System</title>
    <!-- Leaflet CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin=""/>
    <style>
        html, body {
            height: 100%;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Arial, sans-serif;
            background: #0a0a0a;
            color: #fff;
            overflow: hidden;
        }

        #map {
            width: 100%;
            height: 100vh;
        }

        /* Header Tattico MATS */
        .mats-header {
            position: absolute;
            top: 12px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 1000;
            text-align: center;
            pointer-events: none;
            background: rgba(10, 10, 10, 0.85);
            padding: 8px 24px;
            border-radius: 12px;
            border: 1px solid rgba(255, 255, 255, 0.15);
            backdrop-filter: blur(6px);
            box-shadow: 0 4px 20px rgba(0,0,0,0.6);
        }

        .mats-title {
            font-size: 32px;
            font-weight: 900;
            letter-spacing: 2px;
            background: linear-gradient(45deg, #ff0000, #ff7f00, #ffff00, #00ff00, #00ffff, #0000ff, #8b00ff);
            background-size: 400% 400%;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            animation: rainbow-pulse 3s ease infinite;
            margin: 0;
            line-height: 1;
        }

        .mats-subtitle {
            font-size: 11px;
            font-weight: 700;
            color: #00bfff;
            letter-spacing: 1.5px;
            text-transform: uppercase;
            animation: blue-pulse 2s ease-in-out infinite;
            margin-top: 4px;
        }

        @keyframes rainbow-pulse {
            0% { background-position: 0% 50%; opacity: 0.85; transform: scale(0.98); }
            50% { background-position: 100% 50%; opacity: 1; transform: scale(1.02); }
            100% { background-position: 0% 50%; opacity: 0.85; transform: scale(0.98); }
        }

        @keyframes blue-pulse {
            0% { opacity: 0.6; text-shadow: 0 0 2px rgba(0, 191, 255, 0.4); }
            50% { opacity: 1; text-shadow: 0 0 10px rgba(0, 191, 255, 0.9); }
            100% { opacity: 0.6; text-shadow: 0 0 2px rgba(0, 191, 255, 0.4); }
        }

        /* Crediti piccoli in basso a destra */
        .source-credits {
            position: absolute;
            bottom: 6px;
            right: 10px;
            z-index: 1000;
            font-size: 9px;
            color: rgba(255, 255, 255, 0.5);
            background: rgba(0, 0, 0, 0.6);
            padding: 3px 8px;
            border-radius: 4px;
            pointer-events: auto;
        }

        .source-credits a {
            color: rgba(0, 191, 255, 0.8);
            text-decoration: none;
        }

        /* Banner Operativo Inferiore */
        .map-banner {
            position: absolute;
            bottom: 24px;
            left: 10px;
            right: 10px;
            z-index: 1000;
            background: rgba(18, 18, 18, 0.92);
            padding: 8px 14px;
            border-radius: 8px;
            box-shadow: 0 4px 16px rgba(0,0,0,0.5);
            border: 1px solid #333;
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 12px;
            color: #ddd;
            flex-wrap: wrap;
            gap: 10px;
        }

        .counter-badge {
            font-weight: bold;
            color: #ff4d4d;
            font-size: 14px;
        }

        .legend-item {
            display: flex;
            align-items: center;
            gap: 5px;
            font-size: 11px;
            color: #aaa;
        }

        /* Anello Centroide Pulsante */
        .centroid-ring {
            width: 16px;
            height: 16px;
            border-radius: 50%;
            border: 2px solid #ffffff;
            cursor: pointer;
            box-shadow: 0 0 10px rgba(0,0,0,0.9);
            animation: ring-pulse 1.5s infinite ease-in-out;
        }

        @keyframes ring-pulse {
            0% { transform: scale(0.85); opacity: 0.8; }
            50% { transform: scale(1.25); opacity: 1; }
            100% { transform: scale(0.85); opacity: 0.8; }
        }

        /* Overlay Visore 3D Full-Screen */
        #viewer-3d-modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: rgba(5, 5, 8, 0.96);
            z-index: 9999;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            touch-action: none;
        }

        #canvas-3d-container {
            width: 100%;
            height: 80vh;
            display: flex;
            justify-content: center;
            align-items: center;
            cursor: grab;
        }

        #canvas-3d-container:active {
            cursor: grabbing;
        }

        .modal-info-bar {
            position: absolute;
            top: 15px;
            left: 15px;
            right: 15px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: rgba(255, 255, 255, 0.05);
            padding: 10px 16px;
            border-radius: 8px;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .close-btn {
            background: #ff3333;
            color: #fff;
            border: none;
            padding: 8px 16px;
            border-radius: 6px;
            font-weight: bold;
            cursor: pointer;
            font-size: 13px;
        }

        .controls-hint {
            position: absolute;
            bottom: 20px;
            font-size: 11px;
            color: #888;
            pointer-events: none;
            text-align: center;
        }
    </style>
</head>
<body>

    <!-- Header MATS -->
    <div class="mats-header">
        <div class="mats-title">MATS</div>
        <div class="mats-subtitle">Mesoscale Advanced Tracking System</div>
    </div>

    <!-- Mappa -->
    <div id="map"></div>

    <!-- Crediti Fonti -->
    <div class="source-credits">
        Dati: <a href="https://www.rainviewer.com" target="_blank">RainViewer Radar API</a> | Mappa: &copy; Esri World Topo
    </div>

    <!-- Banner Inferiore -->
    <div class="map-banner">
        <div>
            <span><b>Strutture 3D Rilevate:</b> <span id="active-count" class="counter-badge">0</span></span>
            <span id="last-update" style="font-size: 10px; color: #888; border-left: 1px solid #444; margin-left: 10px; padding-left: 8px;"></span>
        </div>
        <div style="display: flex; gap: 10px; flex-wrap: wrap;">
            <div class="legend-item"><span style="width: 12px; height: 3px; background: #0066cc;"></span> Storico</div>
            <div class="legend-item"><span style="width: 8px; height: 8px; background: #ffcc00; border-radius: 50%;"></span> Centroide</div>
            <div class="legend-item"><span style="width: 12px; height: 3px; background: #ff1a1a;"></span> Predittivo</div>
            <div class="legend-item"><span style="width: 12px; height: 8px; background: rgba(255,100,0,0.3); border: 1px dashed #ff5500;"></span> Cono ETA Costa</div>
        </div>
    </div>

    <!-- Full-Screen 3D Modal Viewer -->
    <div id="viewer-3d-modal">
        <div class="modal-info-bar">
            <div>
                <b id="modal-cell-id" style="font-size: 16px; color: #00bfff;">Core 3D</b>
                <div id="modal-cell-details" style="font-size: 12px; color: #ccc;">-</div>
            </div>
            <button class="close-btn" onclick="close3DViewer()">CHIUDI [X]</button>
        </div>
        
        <div id="canvas-3d-container">
            <canvas id="viewer-canvas"></canvas>
        </div>

        <div class="controls-hint">
            Ruota liberamente a 360° | Ancorato al centro della base
        </div>
    </div>

    <!-- Leaflet e Engine 3D -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
    <script>
        var map = L.map('map', { zoomControl: false }).setView([42.5, 12.5], 6);
        L.control.zoom({ position: 'bottomleft' }).addTo(map);

        L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Topo_Map/MapServer/tile/{z}/{y}/{x}', {
            maxZoom: 19,
            attribution: ''
        }).addTo(map);

        var radarLayer = null;
        var cellsLayer = L.layerGroup().addTo(map);
        var vectorsLayer = L.layerGroup().addTo(map);

        function getColor(val) {
            if (val >= 12) return '#ff00ff';
            if (val >= 10) return '#ff0000';
            if (val >= 8)  return '#ffcc00';
            if (val >= 6)  return '#00ff00';
            if (val >= 4)  return '#00ffff';
            return '#0066ff';
        }

        function getMaxVal(matrix) {
            if (!matrix || matrix.length === 0) return 4;
            let max = 0;
            for (let r = 0; r < matrix.length; r++) {
                for (let c = 0; c < matrix[r].length; c++) {
                    if (matrix[r][c] > max) max = matrix[r][c];
                }
            }
            return max > 0 ? max : 4;
        }

        function loadTrackerData() {
            fetch('centroids.json?' + new Date().getTime())
                .then(res => res.json())
                .then(data => {
                    if (data.radar_tile && data.radar_tile.host && data.radar_tile.path) {
                        let radarUrl = data.radar_tile.host + data.radar_tile.path + '/256/{z}/{x}/{y}/2/1_1.png';
                        if (!radarLayer) {
                            radarLayer = L.tileLayer(radarUrl, { opacity: 0.65, zIndex: 200 }).addTo(map);
                        } else {
                            radarLayer.setUrl(radarUrl);
                        }
                    }

                    cellsLayer.clearLayers();
                    vectorsLayer.clearLayers();

                    let structures = data.macro_structures || [];
                    document.getElementById('active-count').innerText = structures.length;
                    document.getElementById('last-update').innerText = 'Aggiornato: ' + new Date().toLocaleTimeString();

                    structures.forEach(track => {
                        let center = track.center;
                        let peakVal = getMaxVal(track.grid_matrix);
                        let cellColor = getColor(peakVal);

                        // 1. Vettore Storico
                        if (track.actual_path && track.actual_path.length > 0) {
                            L.polyline(track.actual_path, { color: '#0066cc', weight: 4, opacity: 0.85 }).addTo(vectorsLayer);
                        }

                        // 2. Anello Centroide Pulsante con severità
                        if (center && center.length === 2) {
                            let centroidIcon = L.divIcon({
                                className: 'custom-centroid',
                                html: `<div class="centroid-ring" style="background-color: ${cellColor};" title="Apri Profilo 3D ${track.id}"></div>`,
                                iconSize: [16, 16],
                                iconAnchor: [8, 8]
                            });

                            let marker = L.marker([center[0], center[1]], { icon: centroidIcon }).addTo(cellsLayer);
                            marker.on('click', () => open3DViewer(track));
                        }

                        // 3. Vettore Predittivo Normale (Traiettoria standard cella)
                        if (track.forecast_path && track.forecast_path.length > 0 && center) {
                            L.polyline([center, ...track.forecast_path], { color: cellColor, weight: 3, dashArray: '5, 6', opacity: 0.85 }).addTo(vectorsLayer);
                        }

                        // 4. Cono ETA in Costa (Stile NOAA)
                        if (track.coast_target && center) {
                            let target = track.coast_target;
                            let dLat = target[0] - center[0];
                            let dLon = target[1] - center[1];
                            
                            let coneLeft = [target[0] - dLon * 0.25, target[1] + dLat * 0.25];
                            let coneRight = [target[0] + dLon * 0.25, target[1] - dLat * 0.25];

                            L.polygon([center, coneLeft, coneRight], {
                                color: '#ff5500',
                                fillColor: '#ff6600',
                                fillOpacity: 0.2,
                                weight: 2,
                                dashArray: '4, 4'
                            }).addTo(vectorsLayer);

                            let etaIcon = L.divIcon({
                                className: 'eta-badge',
                                html: `<div style="background: rgba(0,0,0,0.85); border: 1px solid #ff5500; color: #ffaa00; padding: 2px 6px; border-radius: 4px; font-size: 10px; font-weight: bold; white-space: nowrap;">ETA: ${track.eta_hours || '?'}h</div>`,
                                iconSize: [60, 20],
                                iconAnchor: [30, 10]
                            });
                            L.marker(target, { icon: etaIcon }).addTo(vectorsLayer);
                        }
                    });
                })
                .catch(err => console.log('In attesa aggiornamento MATS 3D...', err));
        }

        // ==========================================
        // ENGINE 3D VOXEL STABILE ORIGINALE (COLONNE DRITTE)
        // ==========================================
        var currentTrack = null;
        var rotX = 0.5; // Inclinazione fissa e stabile
        var rotY = 0.0; // Rotazione orizzontale a 360°
        var isDragging = false;
        var lastMouseX, lastMouseY;

        function open3DViewer(track) {
            currentTrack = track;
            rotY = 0.0;
            rotX = 0.5;
            document.getElementById('modal-cell-id').innerText = track.id + " | " + track.intensity;
            document.getElementById('modal-cell-details').innerText = `Velocità: ${track.speed_kmh} km/h (${track.direction_deg}°) | VIL: ${track.vil} kg/m² | Echo Top: ${track.echo_top} km | ETA Costa: ${track.eta_hours || '?'}h`;
            document.getElementById('viewer-3d-modal').style.display = 'flex';
            render3D();
        }

        function close3DViewer() {
            document.getElementById('viewer-3d-modal').style.display = 'none';
            currentTrack = null;
        }

        var canvas = document.getElementById('viewer-canvas');
        var ctx = canvas.getContext('2d');

        var container = document.getElementById('canvas-3d-container');
        container.addEventListener('mousedown', e => { isDragging = true; lastMouseX = e.clientX; lastMouseY = e.clientY; });
        window.addEventListener('mouseup', () => isDragging = false);
        window.addEventListener('mousemove', e => {
            if (!isDragging) return;
            rotY += (e.clientX - lastMouseX) * 0.008;
            rotX += (e.clientY - lastMouseY) * 0.005;
            rotX = Math.max(0.15, Math.min(0.85, rotX)); // Limiti rigidi bloccati per evitare ribaltamenti

            lastMouseX = e.clientX;
            lastMouseY = e.clientY;
            render3D();
        });

        container.addEventListener('touchstart', e => {
            if (e.touches.length === 1) {
                isDragging = true;
                lastMouseX = e.touches[0].clientX;
                lastMouseY = e.touches[0].clientY;
            }
        });
        window.addEventListener('touchend', () => isDragging = false);
        window.addEventListener('touchmove', e => {
            if (!isDragging || e.touches.length !== 1) return;
            rotY += (e.touches[0].clientX - lastMouseX) * 0.008;
            rotX += (e.touches[0].clientY - lastMouseY) * 0.005;
            rotX = Math.max(0.15, Math.min(0.85, rotX));

            lastMouseX = e.touches[0].clientX;
            lastMouseY = e.touches[0].clientY;
            render3D();
        });

        function render3D() {
            if (!currentTrack) return;
            canvas.width = container.clientWidth;
            canvas.height = container.clientHeight;

            ctx.clearRect(0, 0, canvas.width, canvas.height);

            let matrix = currentTrack.grid_matrix || [];
            let rows = matrix.length;
            let cols = rows > 0 ? matrix[0].length : 0;

            let cx = canvas.width / 2;
            let cy = canvas.height / 2 + 60; // Base d'appoggio orizzontale
            let scale = Math.min(canvas.width, canvas.height) / 22;

            let cosX = Math.cos(rotX), sinX = Math.sin(rotX);
            let cosY = Math.cos(rotY), sinY = Math.sin(rotY);

            let columnsToDraw = [];

            for (let r = 0; r < rows; r++) {
                for (let c = 0; c < cols; c++) {
                    let val = matrix[r][c];
                    if (val <= 0) continue;

                    let x = (c - cols / 2 + 0.5) * 1.0;
                    let y = (r - rows / 2 + 0.5) * 1.0;

                    let px_base = cx + (x * cosY - y * sinY) * scale;
                    let py_base = cy + (x * sinY + y * cosY) * sinX * scale;
                    let depth = (x * sinY + y * cosY) * cosX;

                    let h_px = val * scale * 0.75;
                    let px_top = px_base;
                    let py_top = py_base - h_px;

                    columnsToDraw.push({
                        val: val,
                        color: getColor(val),
                        depth: depth,
                        px_base: px_base,
                        py_base: py_base,
                        px_top: px_top,
                        py_top: py_top,
                        h_px: h_px
                    });
                }
            }

            columnsToDraw.sort((a, b) => a.depth - b.depth);

            let barW = scale * 0.85;

            columnsToDraw.forEach(col => {
                ctx.fillStyle = col.color;
                ctx.strokeStyle = 'rgba(0, 0, 0, 0.7)';
                ctx.lineWidth = 1;

                // Faccia verticale principale dritta
                ctx.beginPath();
                ctx.rect(col.px_base - barW / 2, col.py_top, barW, col.h_px);
                ctx.fill();
                ctx.stroke();

                // Faccia superiore (Tetto Lego)
                ctx.fillStyle = col.color;
                ctx.beginPath();
                ctx.rect(col.px_top - barW / 2, col.py_top - barW / 3, barW, barW / 3);
                ctx.fill();
                ctx.stroke();
            });
        }

        loadTrackerData();
        setInterval(loadTrackerData, 180000);
    </script>
</body>
</html>
